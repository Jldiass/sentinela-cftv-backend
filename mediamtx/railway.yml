logLevel: info
logDestinations: [stdout]

authMethod: http
authHTTPAddress: http://127.0.0.1:8000/internal/mediamtx/auth
authHTTPExclude:
  - action: read
  - action: playback
  - action: api

api: yes
apiAddress: :9997
playback: yes
playbackAddress: :9996
playbackAllowOrigins: ['*']

rtsp: no
rtmp: yes
rtmpAddress: :1935
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ['*']
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
webrtc: no
srt: no
moq: no

pathDefaults:
  source: publisher
  overridePublisher: false
  record: yes
  recordPath: /data/recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  # 60s segments keep R2 upload/list operations well within the free tier
  # (8 cameras * 60 uploads/hour vs. 360/hour at the previous 10s duration).
  recordSegmentDuration: 60s
  # Local disk is only a short safety buffer now: each finished segment is
  # uploaded to R2 and deleted immediately by upload_segment.py. If R2 is
  # unreachable, this still reclaims the Railway volume after 10 minutes.
  recordDeleteAfter: 10m
  runOnRecordSegmentComplete: python3 /app/scripts/upload_segment.py

paths:
  all_others:
