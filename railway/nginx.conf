user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        auth_basic "Malupe Cam";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; media-src 'self' blob:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        location = /railway-health {
            auth_basic off;
            proxy_pass http://127.0.0.1:8000/health;
        }

        location /internal/ {
            auth_basic off;
            return 404;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/auth/(login|forgot-password|register)$ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            proxy_pass http://127.0.0.1:8000/health;
        }

        location = /openapi.json {
            proxy_pass http://127.0.0.1:8000/openapi.json;
        }

        location /docs {
            proxy_pass http://127.0.0.1:8000;
        }

        location /hls/ {
            proxy_buffering off;
            proxy_cache off;
            proxy_pass http://127.0.0.1:8888/;
        }

        location /playback/ {
            proxy_buffering off;
            proxy_pass http://127.0.0.1:9996/;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
